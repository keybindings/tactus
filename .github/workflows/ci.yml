name: CI

on:
  # The integration branch for the parallel-execution design receives slice
  # pull requests and is tested on every merge into it; its slices are
  # reviewed but never attested. decisions/2026-08-21-stacked-slice-prs.md
  push:
    branches: [master, codex/parallelism-design]
  pull_request:
    branches: [master, codex/parallelism-design]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1), so it is not an
        # afterthought here: the subprocess supervisor, the cmd /C quoting and
        # the PATHEXT resolution all behave differently per platform and are
        # covered by tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@tactus.local"
          git config --global user.name "tactus CI"

      - run: cargo test --all-targets --all-features

  msrv:
    name: msrv (Rust 1.85, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets --all-features

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: bash .github/scripts/test-frontier-evidence.sh
      - run: bash .github/scripts/test-frontier-check.sh
      - run: bash .github/scripts/test-frontier-invalidation.sh
      - run: bash .github/scripts/test-frontier-workflow.sh
      - run: bash .github/scripts/test-release-record.sh
      - run: bash .github/scripts/test-pr-policy.sh
      - run: bash .github/scripts/test-pr-ledger-evidence.sh
      - run: bash .github/scripts/test-docs-consistency.sh

  # Branch protection requires this one deliberately stable context. Keeping
  # the external rule pointed at an aggregate means adding a platform or
  # splitting a gate cannot silently leave GitHub protecting yesterday's job
  # names. `always()` makes a failed or cancelled dependency produce a failed
  # aggregate instead of a missing required check that never settles.
  merge-gate:
    name: tactus-ci
    if: always()
    needs: [lint, msrv, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          failed=0
          for gate in LINT MSRV TEST; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$gate did not succeed: $result" >&2
              failed=1
            fi
          done
          exit "$failed"
