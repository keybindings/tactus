# Where an allow of a governed lint may live.
#
# `decisions.effect_site_inventory.mechanism` (2): "an allow-placement scan (a
# unit test over src/**/*.rs, Cargo.toml [lints], and crate-level attributes in
# lib.rs/main.rs) permits allow/expect of disallowed_methods, disallowed_types,
# disallowed_macros, clippy::style, clippy::all, or warnings only as
# module-level attributes in files listed in effects/allowlist.toml, which has
# two sections: funnel modules … and legacy modules frozen at PR5 … each
# carrying a LEGACY-EFFECT justification; the legacy section may only shrink
# after PR5 (the test compares against the frozen list) and never contains a
# topology module (src/topology/**, src/runner/**, src/workspace_manager.rs,
# src/engine/topology.rs)".
#
# The scan is `effects::tests::every_allow_of_a_governed_lint_is_module_level_
# and_in_the_allowlist`. It reads this file, so an entry deleted here fails the
# build of the file that relied on it.
#
# `allows` is the exact lint set the file's attribute names, asserted equal, not
# merely contained: an attribute that allows a lint this file does not record is
# an unreviewed widening, and a file that starts violating a fourth lint fails
# clippy until both are updated together. It is the union over platforms — a
# `#[cfg(windows)]` body's lint cannot be measured from a Unix host — which is
# why `allow` is used rather than `expect`; `expect` would make the union fail
# on whichever platform did not need all of it.
#
# `scanned_beyond_the_packet`: the mechanism sentence says `src/**/*.rs`. The
# scan also covers `examples/**/*.rs`, because `cargo clippy --all-targets`
# compiles examples and `examples/probe.rs` reaches an effect. Scanning wider
# than the sentence can only find more, never less.

# ---------------------------------------------------------------------------
# Funnel modules
#
# "each reviewed to perform effects only inside site-taking APIs and never to
# return writable handles."
#
# The review is over each module's PRODUCTION surface. That is the packet's own
# reading, not a relaxation invented here: the sentence lists
# `src/topology/effects.rs`, whose production surface performs no effect at all,
# beside `src/rundir.rs`, whose test region plants husks with raw `fs` calls.
# ---------------------------------------------------------------------------

