allows = ["clippy::disallowed_methods", "clippy::disallowed_types", "clippy::disallowed_macros"]
packet = "effect_site_inventory.mechanism (2): named first in the funnel-module list"
review = """
Every effect is issued inside a `funnel` call taking an `EffectSiteId` by value \
(Worktree/Snapshot/Ref/Object groups, `FunnelGroup::module()`), and no public \
function returns a `File`, an `OpenOptions` or a `Command`."""

